name: Update Forbes articles

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays, about 6-7 am Pacific
  workflow_dispatch:
  push:
    branches: [probe]

permissions:
  contents: write

concurrency:
  group: forbes-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Forbes and rebuild the lists
        run: python3 scripts/update_forbes.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/forbes.json
          git commit -m "Update Forbes articles and view counts"
          git push
